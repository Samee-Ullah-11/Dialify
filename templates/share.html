<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared contacts — Dialify</title>
<meta name="theme-color" content="#0a66c2">
<link rel="icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f2f5f9; --card:#fff; --text:#141c27; --muted:#64748b;
    --accent:#0b8a43; --brand:#0a66c2; --border:#e3e8ef;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0d1219; --card:#171e28; --text:#e8edf3;
      --muted:#8e9cae; --accent:#2ecc71; --brand:#4da3ff; --border:#263140;
      --shadow: 0 1px 2px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif; font-size:15px; }
  .wrap { max-width:640px; margin:0 auto; padding:16px; }
  header { display:flex; align-items:center; gap:10px; margin:4px 0 14px; }
  .logo { width:36px; height:36px; border-radius:10px; background:var(--brand);
    display:flex; align-items:center; justify-content:center; color:#fff;
    box-shadow:var(--shadow); }
  .logo svg { width:19px; height:19px; }
  h1 { font-size:1.15rem; font-weight:800; letter-spacing:-.02em; margin:0; }
  .muted { color:var(--muted); font-size:.86rem; }
  .contact { display:flex; align-items:center; gap:12px; padding:12px 14px;
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    margin-bottom:8px; box-shadow:var(--shadow); }
  .avatar { width:40px; height:40px; border-radius:50%; flex:none; display:flex;
    align-items:center; justify-content:center; background:var(--brand);
    color:#fff; font-weight:700; font-size:.9rem; }
  .info { flex:1; min-width:0; }
  .name { font-weight:600; }
  .phone { color:var(--muted); font-size:.83rem; font-variant-numeric:tabular-nums; }
  .callbtn { width:40px; height:40px; border-radius:50%; flex:none; display:flex;
    align-items:center; justify-content:center; background:var(--accent);
    color:#fff; text-decoration:none; box-shadow:var(--shadow); }
  .callbtn.wa { background:#25d366; }
  .callbtn svg { width:18px; height:18px; fill:none; stroke:currentColor;
    stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
    <div>
      <h1>Shared contact list</h1>
      <div class="muted">Read-only — shared via Dialify · {{ contacts|length }} contact(s)</div>
    </div>
  </header>
  {% for c in contacts %}
  <div class="contact">
    <div class="avatar">{{ (c.name or '#')[:1] | upper }}</div>
    <div class="info">
      <div class="name">{{ c.name or '(no name)' }}</div>
      <div class="phone">{{ c.phone }}</div>
    </div>
    <a class="callbtn" href="tel:{{ c.phone }}" title="Call"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></a>
    <a class="callbtn wa" href="https://wa.me/{{ c.phone | replace('+','') }}" target="_blank" rel="noopener" title="WhatsApp"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg></a>
  </div>
  {% endfor %}
</div>
</body>
</html>
